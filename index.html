<!DOCTYPE html> 
        <!-- Tells browser this is an HTML page -->
<html lang="en-US">
          <!-- Wraps the whole page -->
    <head>
             <!-- Contains information about the page, like the title -->
        <meta charset="utf-8" />
            <!-- defins the characters that can be used on the website -->
        <title>My test page</title>
            <!-- search engines use to categorize and label the browser table -->
    </head>
    <body>
             <!-- Contains what users will actually see -->
        <p>This is my page</p>
        <p>hello world</p>
    </body>
</html>
